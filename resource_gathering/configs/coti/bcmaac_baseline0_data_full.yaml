agent_model:
  name: Qwen/Qwen3-4B-Instruct-2507
  type: qwen
  temperature: 0.5
  top_p: 0.6
  top_k: null
  dtype: bf16

critic_model:
  name: Qwen/Qwen3-4B-Instruct-2507
  type: qwen
  dtype: bf16

seed: 42
debug: true

coti:
  variant: baseline0

dataset:
  name: resource_gathering
  type: resource_gathering
  train_split: '[:7]'
  eval_split: '[7:]'
  json_path: ../../dataset/data.json

prompt:
  use_chat_template: true

task:
  view: 2
  extraction_limit: 2
  extraction_range: 2
  max_path_len: 4
  comm_limit: 1
  max_turns: 4

output:
  base_dir: output_resource_gathering_baseline0_full
  verbose: true
  save_final_model: false
  save_path: output_resource_gathering_baseline0_full
  save_best_model: false
  best_model_path: output_resource_gathering_baseline0_full/best_model
  best_metric: eval/turn_4/expected_return
  best_metric_mode: max

external:
  mode: empty_feedback
  original_prompt: true
  previous_response: false

bcmaac:
  agent_devices:
  - cuda:0
  critic_devices:
  - cuda:0
  num_agents: 2
  num_turns: 4
  critic_type: v
  num_train_epochs: 180
  agent_learning_rate: 2.5e-6
  critic_learning_rate: 2.5e-6
  rollout_buffer_size: 8
  train_batch_size: 4
  value_loss_coef: 0.6
  max_new_tokens: 160
  discount: 0.9
  eval_interval: 1
  eval_num_samples: 4
  eval_batch_size: 1
  logging_steps: 20

baseline:
  context_learning_rate: 3.0e-5
  context_hidden_dim: 128
  context_cnn_channels: 32
  context_scalar_hidden_dim: 64
  entropy_coef: 0.01
  critic_backbone: text
  critic_context_scale: 0.0
  max_grad_norm: 1.0
  value_head_hidden_dim: 256
  actor_condition_dim: 128
  critic_condition_dim: 128
  preference_loss_coef: 0.1
  comm_preference_loss_scale: 0.35
  probe_preference_loss_scale: 0.0
  cmds_preference_loss_scale: 1.0
  path_preference_loss_scale: 1.0
  score_chunk_size: 2
  actor_gradient_checkpointing: true

reward_shaping:
  progress_reward_scale: 8.0
  terminal_bonus: 7.0
  move_cost_scale: 0.0
  comm_cost_scale: 0.0
  wasted_extraction_penalty: 0.1
  move_to_zone_bonus_scale: 0.05
  useful_comm_bonus_scale: 0.1
  first_enter_zone_bonus_scale: 0.15

reward_processor:
  enabled: true
  scale_factor: 1.0
  shift: 0.0

wandb:
  project: resource_gathering_baseline0
  entity: OpenMLRL
  run_name: resource_gathering_baseline0_data
  dir: output_resource_gathering_baseline0_full
  tags:
  - bcmaac
  - resource_gathering
  - baseline0
