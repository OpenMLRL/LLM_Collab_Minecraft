agent_model:
  name: Qwen/Qwen3-4B-Instruct-2507
  type: qwen
  temperature: 0.5
  top_p: 0.6
  top_k: null
  max_length: 2048
  dtype: bf16

agents: null

critic_model:
  name: Qwen/Qwen3-4B-Instruct-2507
  type: qwen
  max_length: 2048
  dtype: bf16

critics: null

seed: 42

debug: true

dataset:
  name: resource_gathering
  type: resource_gathering
  train_split: '[:7]'
  eval_split: '[7:]'
  json_path: ../../dataset/data.json

prompt:
  use_chat_template: true

task:
  view: 2
  extraction_range: 2
  max_path_len: 4
  comm_limit: 1
  max_turns: 4

output:
  base_dir: output_maac_resource_gathering
  verbose: false
  save_final_model: false
  save_path: output_maac_resource_gathering

external:
  mode: empty_feedback
  original_prompt: true
  previous_response: false
  external_prompt_passthrough: false

maac:
  parallel_training: none
  agent_devices:
  - cuda:0
  critic_devices:
  - cuda:0
  num_agents: 2
  num_turns: 4
  critic_type: v
  num_train_epochs: 150
  agent_learning_rate: 2.5e-6
  critic_learning_rate: 2.5e-6
  value_loss_coef: 0.6
  rollout_buffer_size: 1
  train_batch_size: 1
  max_new_tokens: 512
  discount: 0.9
  early_termination_threshold: 1000
  eval_interval: 1
  eval_num_samples: 4
  eval_batch_size: 1
  logging_steps: 20

reward_shaping:
  progress_reward_scale: 8.0
  terminal_bonus: 7.0
  move_cost_scale: 0.0
  comm_cost_scale: 0.0
  move_to_zone_bonus_scale: 0.05
  useful_comm_bonus_scale: 0.1
  first_enter_zone_bonus_scale: 0.15

reward_processor:
  enabled: true
  scale_factor: 1.0
  shift: 0.0

wandb:
  project: resource_gathering
  entity: OpenMLRL
  run_name: resource_gathering_maac
  dir: output_maac_resource_gathering
  tags:
  - maac
  - resource_gathering
